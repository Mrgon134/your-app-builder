workflows:
  ios-app-store:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - ios_app_store
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.nuju.journal"
      xcode: latest
      node: 18.17.1

    scripts:
      - name: Setup environment
        script: |
          set -e
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo "Xcode version:"
          xcode-select --version

      - name: Install dependencies
        script: |
          set -e
          npm install

      - name: Build React app
        script: |
          set -e
          npm run build

      - name: Setup Capacitor iOS
        script: |
          set -e
          # Generate iOS project if not exists
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          set -e
          cd ios/App
          pod install

      - name: Update build number
        script: |
          set -e
          BUILD_NUMBER=$(($(date +%s) / 60))
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS archive
        script: |
          set -e
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build complete
        script: |
          echo "iOS archive created successfully!"
          echo "Archive: ios/App/build/App.xcarchive"
          echo "Next: Add Apple Developer credentials for signed builds"

    artifacts:
      - ios/App/build/App.xcarchive/**
      - ios/App/build/ipa/**
      - build/DerivedData/Logs/Build/**

    publishing:
      email:
        recipients:
          - $DEVELOPER_MAIL
        notify:
          success: true
          failure: true
