workflows:
  ios-app-store:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - ios_app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.nuju.journal
      vars:
        APP_STORE_APPLE_ID: "6763682187"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.nuju.journal"
      xcode: latest
      node: 22

    scripts:
      - name: Setup environment
        script: |
          set -e
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo "Xcode version:"
          xcodebuild -version

      - name: Install dependencies
        script: |
          set -e
          npm ci

      - name: Validate iOS release environment
        script: |
          set -e
          node scripts/validate-ios-release-env.mjs

      - name: Build React app
        script: |
          set -e
          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Set up code signing settings
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Update build number
        script: |
          set -e
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            LATEST_APP_STORE_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" --platform IOS || echo 0)
            LATEST_TESTFLIGHT_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS || echo 0)
            if [ "$LATEST_TESTFLIGHT_BUILD_NUMBER" -gt "$LATEST_APP_STORE_BUILD_NUMBER" ]; then
              LATEST_BUILD_NUMBER="$LATEST_TESTFLIGHT_BUILD_NUMBER"
            else
              LATEST_BUILD_NUMBER="$LATEST_APP_STORE_BUILD_NUMBER"
            fi
            BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
            BUILD_NUMBER=$(($(date +%s) / 60))
          fi
          echo "Using iOS build number: $BUILD_NUMBER"
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Build complete
        script: |
          echo "iOS IPA created successfully."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - build/DerivedData/Logs/Build/**

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - $DEVELOPER_MAIL
        notify:
          success: true
          failure: true
